# Terminal Chat — cli-standard plugin strings (UI labels registered via the
# core UI registry). Languages retained: en (English), zh (Simplified Chinese).
#
# Format (hand-parsed by the crate build script; keep values double-quoted):
#
#   [key]
#   en = "English text"
#   zh = "简体中文"
#
# Command names, argv, option keys, prefix glyphs and placeholder tokens such
# as {name} / {namespace} stay out of this dictionary.


# Terminal Chat — SRV strings (messages pushed back to clients).
# Languages retained: en (English), zh (Simplified Chinese) only.
#
# Placeholders ({freq}, {target}, ...) are filled by the caller with
# String::replace(); pure echoed data (message bodies, filenames, listings)
# stays out of this dictionary.

[srv.welcome]
en = "welcome, {user}@{ip}"
zh = "欢迎，{user}@{ip}"

[srv.bye]
en = "bye"
zh = "再见"


[package]
name = "edit"
version = "2.0.0"

authors = ["microsoft"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

build = "build/main.rs"
categories = ["text-editors"]

[package.metadata.wix]
upgrade-guid = "E5D1C99D-6DC6-4095-A181-18F59BDE1388"
path-guid = "72E58D22-6CD2-4C00-BFEB-BAADBA7D3A78"
license = false
eula = false

[[bench]]
name = "lib"
harness = false

[features]
# Display editor latency in the top-right corner
debug-latency = []

[dependencies]
lsh.workspace = true
stdext.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
stdext.workspace = true
lsh.workspace = true
# The default toml crate bundles its dependencies with bad compile times. Thanks.
# Thankfully toml-span exists. FWIW the alternative is yaml-rust (without the 2 suffix).
toml-span = { version = "0.7", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
zstd = { version = "0.13", default-features = false }

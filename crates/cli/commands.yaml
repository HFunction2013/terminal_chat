commands:
  - name: setg
    about: Set global options
    args:
      - name: key
        required: true
        value_name: KEY
        help: Config key name
      - name: value
        required: false
        value_name: VALUE
        help: Target config value
      - name: p
        short: p
        long: password
        help: use rpassword to read the value
        action: set_true
        conflicts_with: value
  - name: set
    about: Set session options
    args:
      - name: key
        required: true
        value_name: KEY
        help: Session config key
      - name: value
        required: true
        value_name: VALUE
        help: Session config value
  - name: route
    about: Trace route to server
  - name: proxy_off
    about: Turn off system proxy
  - name: show
    about: Show runtime information
    subcommands:
      - name: options
        about: Show available set/setg options
      - name: afreqs
        about: Show all active frequencies
      - name: ausers
        about: Show active users in current frequency
      - name: mods
        about: Show moderators in current frequency
  - name: join_freq
    about: Join a target frequency channel
    args:
      - name: freq
        required: true
        value_name: FREQ_ID
        help: Target frequency id
  - name: create_freq
    about: Create a new frequency channel
    args:
      - name: freq
        required: true
        value_name: FREQ_ID
        help: New frequency unique id
      - name: p
        short: p
        long: password
        help: Create frequency with password
        action: set_true
      - name: max_people
        long: max-people
        value_name: NUM
        help: Max online user limit
        action: set
        required: false
  - name: background
    about: Background current session and return to main console
  - name: sessions
    about: Multi-session manager
    multiple_values: false
    args:
      - name: list
        long: list
        short: l
        help: List all running sessions
        action: set_true
      - name: interact
        long: interact
        short: i
        value_name: SESSION_ID
        help: Switch to target session
        action: set
      - name: kill
        long: kill
        short: k
        value_name: SESSION_ID
        help: Close and destroy target session
        action: set
  - name: load
    about: Load Plugin
    subcommands:
      - name: plugin
        about: load plugin
        args:
          - name: load_namespace
            short: l
            long: load-namespace
            help: load plugin's namespace while loading the plugin
            action: set_true
          - name: plugin
            value_name: PLUGIN
            required: true
            help: Plugin to load
      - name: namespace
        about: load namespace
        args:
          - name: namespace
            value_name: NAMESPACE
            required: true
            help: namespace to load
  - name: unload
    about: Unload Plugin
    subcommands:
      - name: plugin
        about: unload plugin
        args:
          - name: plugin_name
            value_name: PLUGIN_NAME
            required: true
            help: Plugin to unload
      - name: namespace
        about: unload namespace
        args:
          - name: namespace_name
            value_name: NAMESPACE_NAME
            required: true
            help: namespace to unload
  - name: clear
    about: Clear the Screen
  - name: tcpm
    about: Terminal Chat Package Manager
    subcommands:
      - name: search
        about: Search plugin in registry
        args:
          - name: plugin_name
            value_name: PLUGIN_NAME
            required: true 
            help: plugin name to search
      - name: show
        about: Show plugin information from registry(default)
        args:
          - name: plugin
            value_name: PLUGIN_NAME
            required: true
            help: Plugin to show
          - name: local
            short: l
            long: local
            help: Show local plugin
            action: set_true
      - name: list
        about: List plugin with certain constraints.
        subcommands:
          - name: installed
            about: show all installed plugins.
          - name: downloaded
            about: show all downloaded plugins.
          - name: loaded
            about: show all loaded plugins.
          - name: registry
            about: |
              Show all plugins from registry.
              Use this carefully.
      - name: install
        about: Install plugin
        args:
          - name: plugin
            value_name: PLUGIN_NAME
            required: true
            help: Plugin to install
          - name: registry
            long: registry
            required: false
            action: set
            help: Set plugin registry
          - name: uload
            short: u
            long: uload
            required: false
            action: set_true
            help: Use plugin's namespace when start
          - name: local
            short: l
            long: local
            help: Install local plugin
            action: set
      - name: uninstall
        about: Uninstall plugin
        args:
          - name: plugin
            value_name: PLUGIN
            required: true
            help: Plugin to uninstall
          - name: delete_local
            short: d
            long: delete-local-file
            required: false
            action: set_true
            help: Delete local file
      - name: download
        about: Download plugin
        args:
          - name: plugin
            value_name: PLUGIN
            required: true
            help: Plugin to download
          - name: registry
            long: registry
            required: false
            action: set
            help: Set plugin registry
          - name: load
            required: false
            long: load
            short: l 
            action: set_true
            help: load plugin after download
          - name: use_namespace
            long: use-namespace
            short: u 
            action: set_true
            help: load plugin and namespace after download
            conflicts_with: load
  - name: upload
    about: Upload file or folder to server.
    args: 
      - name: local_path
        required: true
        value_name: LOCAL_PATH
        help: Local path to upload.
      - name: remote_path
        required: false
        value_name: REMOTE_PATH
        help: Remote path to upload.
  - name: download
    about: Download file or folder to server.
    args: 
      - name: remote_path
        required: true
        value_name: REMOTE_PATH
        help: Remote path to download.
      - name: local_path
        required: false
        value_name: LOCAL_PATH
        help: Local path to store downloads.
  - name: checksum
    about: Get checksum of remote file (SHA256).
    args:
      - name: file
        value_name: FILE
        required: true
        help: Remote file to check. NO FOLDERS!
  - name: cd
    about: Change the current remote directory to DIR.
    args:
      - name: dir
        value_name: DIR
        required: true
        help: DIR to change.
  - name: pwd
    about: Get current remote directory.
  - name: ls
    about: List files in current directory.
  - name: mkdir
    about: Make directory in remote server.
    args:
      - name: directory
        required: true 
        value_name: DIR
        help: DIR to make.
  - name: file_info
    about: Get remote file infomation.
    args:
      - name: file
        value_name: FILE
        required: true
        help: The remote file
  - name: leave_freq
    about: Leave current frequency.
  - name: call
    about: Call an user
    args:
      - name: USER
        value_name: USER
        help: The user
        required: true 
  - name: msg
    about: send message
    args:
      - name: message
        value_name: MSG
        required: true
        help: 'Your message, send #EDITOR# to open editor'
      - name: users
        value_name: USERS
        num_args: "0.."
        help: The users, default everybody.
  - name: schedule_msg
    about: Schedules message.
    args:
      - name: time
        value_name: TIME
        help: send time
      - name: message
        value_name: MSG
        required: true
        help: 'Your message, send #EDITOR# to open editor'
      - name: users
        value_name: USERS
        num_args: "0.."
        help: The users, default everybody.
  - name: cancel
    about: cancel a task
    args: 
      - name: task_id
        help: The task id
        required: true
        value_name: TASK_ID
  - name: schedule
    about: schedule a task
    args:
      - name: session
        required: true
        value_name: SESSION
        help: The certain session, 0 for main console.
      - name: time
        value_name: TIME
        help: send time
        required: true
      - name: cmd
        value_name: CMD
        help: 'Dest CMD, #EDITOR# to open editor'
        required: true
  - name: tasks
    about: Get scheduled tasks.
  - name: whoami
    about: Get username.
  - name: unset
    about: Unset variable.
    args:
      - name: key
        required: true
        value_name: KEY
        help: Config key name
  - name: create
    about: Create alias or marco
    subcommands:
      - name: alias
        about: Create alias
        args:
          - name: cmd
            value_name: CMD
            required: true 
            help: alias source
          - name: alias
            value_name: ALIAS
            required: true 
            help: alias dest
      - name: marco
        about: Create marco
        args:
          - name: marco_name
            value_name: MARCO_NAME
            required: true 
            help: marco name
          - name: marco_body
            value_name: MARCO_BODY
            required: true 
            help: 'Marco body, #EDITOR# to open editor'
  - name: run
    about: run a certain marco
    args:
      - name: marco_name
        value_name: MARCO_NAME
        required: true 
        help: marco name
  - name: delete
    about: delete a alias or marco
    subcommands:
      - name: alias
        about: Delete alias
        args:
          - name: alias
            value_name: ALIAS
            required: true 
            help: alias to delete
      - name: marco
        about: Delete marco
        args:
          - name: marco_name
            value_name: MARCO_NAME
            required: true 
            help: marco to delete
  - name: status
    about: Test network
  - name: freq_info
    about: Get frequency information
    args:
      - name: frequency
        value_name: FREQ
        required: true 
        help: freq ID
  - name: reply
    about: Reply to the user who has just spoken quickly
    args:
      - name: message
        value_name: MSG
        required: false
        help: 'Your message, if not given, fallback to editor mode. Also switch to editor if MSG==#EDITOR#'
  - name: ignore
    about: Ignore comments of certain user
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: unignore
    about: Unignore comments of certain user
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: user_info
    about: Show user information
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: away
    about: Set your status to be busy or away
    args:
      - name: status
        value_name: STATUS
        required: false 
        help: |
          Your status, only away and busy avaliable.
          Default: away.
          Auto replies private messages. Like:
            [bot-reply] I am busy now. Contact me later.
  - name: foreground
    about: Switch to session if there is only one.
  - name: disconnect
    about: Disconnect from server
  - name: reconnect
    about: Reconnect the server
  - name: connect
    about: Connect the server
  - name: logs
    about: open/close logging
    debug_only: true
    args:
      - name: operation
        value_name: OP
        required: false
        help: 'Operation (open|close). default: open'  
  - name: kick
    about: kick user from freq (op)
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: ban
    about: ban user from freq
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: unban
    about: unban banned users
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: mute
    about: mute a certain user, use `set QUIET true` to mute everyboy except mods.
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: unmute
    about: mute reversed.
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: op
    about: give mod permission to a certain user.
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: deop
    about: take mod permission from a certain user, noone can deop creator.
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: trop
    about: transfer creator permission.
    args:
      - name: user
        value_name: USER
        required: true 
        help: the full username, e.g., HZFY@192.168.78.91
  - name: disband
    about: disband current frequency.


aliases:
  - name: join_freq
    alias: jfreq
  - name: create_freq
    alias: cfreq
  - name: background
    alias: bg
  - name: upload
    alias: upl
  - name: download
    alias: dl
  - name: leave_freq
    alias: lfreq
  - name: foreground
    alias: fg
  - name: disconnect
    alias: dc
  - name: reconnect
    alias: rc
  - name: connect
    alias: conn
  - name: mkdir
    alias: md
[package]
name = "cli_core"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
once_cell = "1.19"
paste = "1.0.15"
clap = "4"
anyhow = "1.0.103"
humantime = "2.1"
rpassword = "7.5.4"
which = "8.0.5"
shell-words = "1.1.1"
safer-ffi = "0.2.0-rc1"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.0"
[package]
name = "lolcat"
version = "0.2.0"
edition = "2024"
description = "Rust rewrite of lolcat from skyline69 – zero-dependency rainbow text with animations, tests, and CI."
readme = "README.md"
repository.workspace = true
license = "BSD-3-Clause"
authors = ["skyline69"]
keywords = ["lolcat", "ansi", "terminal", "color", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.91.0"

[dependencies]

[[bin]]
name = "lolcat"
path = "src/main.rs"

[lib]
name = "lolcat"
path = "src/lib.rs"